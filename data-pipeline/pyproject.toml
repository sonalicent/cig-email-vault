[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-pipeline"
version = "0.1.0"
description = "S3-triggered Lambda that converts .eml emails into Markdown + JSON under emails-extracted/."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "boto3>=1.34",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "pdfplumber>=0.11",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb,s3]>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
